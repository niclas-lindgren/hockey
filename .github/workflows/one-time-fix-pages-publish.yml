name: "One-time fix: preserve Pages content"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fix-pages-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-fix-pages-publish
  cancel-in-progress: false

jobs:
  repair:
    name: "Repair publisher and restore registrations"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Patch Pages-publisering"
        run: python scripts/one_time_fix_pages_publish.py

      - name: "Installer testavhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: "Kjør regresjonstester"
        run: pytest -q tests/test_pages_publish.py tests/test_pages_publish_preservation.py

      - name: "Commit fiks til main"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tournament_scheduler/pipeline/pages_publish.py tests/test_pages_publish_preservation.py
          if git diff --cached --quiet; then
            echo "Ingen kodeendringer å committe."
          else
            git commit -m "[skip ci] Preserve independent Pages content across publishes"
            git push origin HEAD:main
          fi

      - name: "Gjenopprett siden for påmeldte lag"
        run: |
          scripts/rvv-miniputt registered-teams \
            --csv inputs/registrations/registered-teams.csv \
            --work-dir .pipeline/github-registration-restore \
            --publish \
            --confirm-public \
            --json
