name: "One-time fix: remove embed borders"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-remove-embed-borders.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-remove-embed-borders
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Fjern ytre kantlinjer i iframe-modus"
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tournament_scheduler/pipeline/activity_viewer.py"): (
                  "  .is-embed .panel { box-shadow: none; padding: 10px; }",
                  "  .is-embed .panel { border: 0; border-radius: 0; background: transparent; box-shadow: none; padding: 0; }",
              ),
              Path("tournament_scheduler/pipeline/registered_teams.py"): (
                  "  .is-embed main {{ box-shadow:none; }}",
                  "  .is-embed main {{ border:0; border-radius:0; background:transparent; box-shadow:none; }}",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"Fant ikke forventet CSS i {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer runtime-avhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: "Valider generert iframe-CSS"
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from tournament_scheduler.pipeline.activity_viewer import generate_html
          from tournament_scheduler.pipeline.registered_teams import render_registered_teams_html

          with TemporaryDirectory() as tmp:
              activity_html = Path(generate_html(export_dir=tmp)).read_text(encoding="utf-8")

          registration_html = render_registered_teams_html({
              "generated_at": "2026-08-03T06:00:00Z",
              "total_teams": 0,
              "age_groups": [],
          })

          assert ".is-embed .panel { border: 0; border-radius: 0; background: transparent; box-shadow: none; padding: 0; }" in activity_html
          assert ".is-embed main { border:0; border-radius:0; background:transparent; box-shadow:none; }" in registration_html
          assert ".timeline-shell { overflow: hidden; border: 1px solid var(--border);" in activity_html
          assert ".club + .club { border-top:1px solid var(--line); }" in registration_html
          PY

      - name: "Commit endringen"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournament_scheduler/pipeline/activity_viewer.py tournament_scheduler/pipeline/registered_teams.py
          git commit -m "[skip ci] Remove outer borders from embedded pages"
          git push origin HEAD:main

      - name: "Publiser aktivitetskalender"
        run: |
          scripts/rvv-miniputt activities \
            --input inputs/activities/activities.json \
            --work-dir .pipeline/embed-border-activity \
            --publish \
            --confirm-public \
            --json

      - name: "Publiser påmeldte lag"
        run: |
          scripts/rvv-miniputt registered-teams \
            --csv inputs/registrations/registered-teams.csv \
            --work-dir .pipeline/embed-border-registrations \
            --publish \
            --confirm-public \
            --json
