name: "One-time fix: activity overview wording and today label"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fix-activity-overview-91.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: one-time-fix-activity-overview-91
  cancel-in-progress: false

jobs:
  update-test-publish-close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Oppdater aktivitetsoversikten"
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: forventet 1 treff, fant {count}")
              return text.replace(old, new, 1)

          source_path = Path("tournament_scheduler/pipeline/activity_viewer.py")
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              r'''    const today = new Date();
              const todayLine = today.getFullYear() === timelineYear ? `<div class="timeline-today" style="left:${dateToPercent(today.toISOString().slice(0, 10), timelineYear).toFixed(4)}%"><span>I dag</span></div>` : '';
              const laneRows = lanes.map(group => {'''.replace('\\"', '"'),
              r'''    const today = new Date();
              const todayPosition = today.getFullYear() === timelineYear
                ? dateToPercent(today.toISOString().slice(0, 10), timelineYear).toFixed(4)
                : null;
              const laneRows = lanes.map((group, laneIndex) => {''',
              "today-blokk",
          )
          source = replace_once(
              source,
              r'''      return `<div class="timeline-lane-label">${escapeHtml(laneLabel(group))}</div><div class="timeline-lane">${todayLine}${laneItems || '<div class="timeline-empty">Ingen aktiviteter i valgt filter.</div>'}</div>`;'''.replace('\\"', '"'),
              r'''      const todayLine = todayPosition === null
                ? ''
                : `<div class="timeline-today" aria-hidden="true" style="left:${todayPosition}%">${laneIndex === 0 ? '<span>I dag</span>' : ''}</div>`;
              return `<div class="timeline-lane-label">${escapeHtml(laneLabel(group))}</div><div class="timeline-lane">${todayLine}${laneItems || '<div class="timeline-empty">Ingen aktiviteter i valgt filter.</div>'}</div>`;'''.replace('\\"', '"'),
              "lane-retur",
          )
          source = replace_once(
              source,
              "Standalone public activity calendar page generation (issues #33/#38/#40).",
              "Standalone public activity calendar page generation (issues #33/#38/#40/#91).",
              "moduldokumentasjon",
          )
          source = replace_once(source, "Sesongsløp ${timelineYear}", "Aktivitetsoversikt ${timelineYear}", "overskrift")
          source = replace_once(
              source,
              "Sesongsløp med aldersgrupper som rader og dato gjennom året som vannrett akse",
              "Aktivitetsoversikt med aldersgrupper som rader og dato gjennom året som vannrett akse",
              "tilgjengelig navn",
          )
          source = source.replace("Sesongsløp", "Sesongoversikt").replace("sesongsløp", "sesongoversikt")
          if "Sesongsløp" in source or "sesongsløp" in source:
              raise SystemExit("Gammel brukerrettet betegnelse finnes fortsatt i generatoren")
          if source.count("<span>I dag</span>") != 1:
              raise SystemExit("I dag-merket skal finnes nøyaktig én gang i malen")
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_activity_viewer.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '"""Tests for the standalone activity calendar page (issues #33, #38, and #40)."""',
              '"""Tests for the standalone activity calendar page (issues #33, #38, #40, and #91)."""',
          )
          tests = replace_once(
              tests,
              '        assert "Sesongsløp" in html\n',
              '        assert "Sesongoversikt" in html\n'
              '        assert "Aktivitetsoversikt ${timelineYear}" in html\n'
              '        assert "Sesongsløp" not in html\n',
              "visningstest",
          )
          anchor = '        assert "daysInYear(targetYear) - 1" in html\n'
          tests = replace_once(
              tests,
              anchor,
              anchor
              + '        assert html.count("<span>I dag</span>") == 1\n'
              + '        assert "lanes.map((group, laneIndex) =>" in html\n'
              + '        assert "laneIndex === 0" in html\n'
              + "        assert 'aria-hidden=\"true\"' in html\n",
              "today-tester",
          )
          tests = replace_once(
              tests,
              '        assert "Sesongsløp" in docs\n',
              '        assert "Sesongoversikt" in docs\n'
              '        assert "Sesongsløp" not in docs\n',
              "dokumentasjonstest",
          )
          test_path.write_text(tests, encoding="utf-8")

          docs_path = Path("docs/rvv-miniputt-pipeline.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace("Sesongsløp", "Sesongoversikt").replace("sesongsløp", "sesongoversikt")
          docs_path.write_text(docs, encoding="utf-8")
          PY

      - name: "Kontroller endringene"
        run: |
          ! grep -R -n -E 'Sesongsløp|sesongsløp' \
            tournament_scheduler/pipeline/activity_viewer.py \
            docs/rvv-miniputt-pipeline.md
          test "$(grep -o '<span>I dag</span>' tournament_scheduler/pipeline/activity_viewer.py | wc -l)" -eq 1
          git diff --check

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer testavhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: "Kjør fokuserte tester"
        run: pytest -q tests/test_activity_viewer.py tests/test_activity_export.py

      - name: "Commit endringen direkte på main"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournament_scheduler/pipeline/activity_viewer.py tests/test_activity_viewer.py docs/rvv-miniputt-pipeline.md
          git commit -m "Fix activity overview wording and today label (#91)"
          git push origin HEAD:main

      - name: "Publiser oppdatert aktivitetsoversikt"
        run: |
          scripts/rvv-miniputt activities \
            --input inputs/activities/activities.json \
            --work-dir .pipeline/activity-overview-91 \
            --publish \
            --confirm-public \
            --json

      - name: "Lukk issue 91"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close 91 \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Rettet direkte på main: bare øverste rad viser «I dag», visningen heter nå «Sesongoversikt», og overskriften er «Aktivitetsoversikt <år>». Fokuserte tester besto og aktivitetsoversikten er publisert på nytt."

      - name: "Fjern engangs-workflowen"
        run: |
          git rm .github/workflows/one-time-fix-activity-overview-91.yml
          git commit -m "Remove one-time activity overview fix workflow"
          git push origin HEAD:main
