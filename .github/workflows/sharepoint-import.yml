name: "SharePoint: importer aktivitetsdata (JSON)"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Nummeret på GitHub-issuen som skal importeres"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: sharepoint-activities-import
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CANONICAL_PATH: "inputs/activities/activities.json"

jobs:
  import-activities-json:
    name: "Importer aktivitetsdata (content_json) fra SharePoint"
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event.issue.title == 'sharepoint-sync: activities'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
      version: ${{ steps.parse.outputs.version }}
      drive_item_id: ${{ steps.parse.outputs.drive_item_id }}
      sha256: ${{ steps.validate.outputs.sha256 }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Hent og valider issue"
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          BODY_FILE="$RUNNER_TEMP/sharepoint-issue-body.txt"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh issue view "$ISSUE_NUMBER" \
              --json title,body,authorAssociation,state \
              > "$RUNNER_TEMP/issue-payload.json"

            TITLE=$(jq -r '.title' "$RUNNER_TEMP/issue-payload.json")
            AUTHOR_ASSOC=$(jq -r '.authorAssociation' "$RUNNER_TEMP/issue-payload.json")
            STATE=$(jq -r '.state' "$RUNNER_TEMP/issue-payload.json")

            if [ "$TITLE" != "sharepoint-sync: activities" ]; then
              echo "FEIL: Issuen har feil tittel: '$TITLE'" >&2
              exit 1
            fi
            if ! jq -e --arg a "$AUTHOR_ASSOC" '["OWNER","MEMBER","COLLABORATOR"] | index($a)' >/dev/null; then
              echo "FEIL: Forfatteren har ikke trusted-tilgang: $AUTHOR_ASSOC" >&2
              exit 1
            fi
            if [ "$STATE" != "OPEN" ]; then
              echo "FEIL: Issuen er ikke åpen: $STATE" >&2
              exit 1
            fi

            jq -r '.body' "$RUNNER_TEMP/issue-payload.json" > "$BODY_FILE"
          else
            jq -r '.issue.body' "$GITHUB_EVENT_PATH" > "$BODY_FILE"
          fi

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer avhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: "Parse issue-body"
        id: parse
        env:
          ISSUE_BODY_FILE: ${{ steps.issue.outputs.body_file }}
          EXPECTED_DRIVE_ID: ${{ vars.SHAREPOINT_ACTIVITIES_DRIVE_ID }}
          EXPECTED_DRIVE_ITEM_ID: ${{ vars.SHAREPOINT_ACTIVITIES_DRIVE_ITEM_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          issue_body = Path(os.environ["ISSUE_BODY_FILE"]).read_text(encoding="utf-8")

          required = {"source", "content_json"}
          allowed = required | {"target_path", "drive_id", "drive_item_id", "version"}
          key_re = re.compile(r"^([a-z_][a-z0-9_]*)=(.*)$")

          errors: list[str] = []
          parsed: dict[str, str] = {}
          seen: set[str] = set()

          for raw_line in issue_body.splitlines():
              line = raw_line.strip()
              if not line or line.startswith(("#", ">", "```")):
                  continue
              match = key_re.match(line)
              if not match:
                  continue
              key, value = match.group(1), match.group(2).strip()
              if key in seen:
                  errors.append(f"Duplikat nøkkel: {key}")
                  continue
              if key not in allowed:
                  errors.append(f"Ukjent nøkkel: {key}")
                  continue
              seen.add(key)
              if not value:
                  errors.append(f"Tom verdi for: {key}")
                  continue
              parsed[key] = value

          missing = required - set(parsed)
          if missing:
              errors.append(f"Mangler påkrevde felt: {', '.join(sorted(missing))}")

          if parsed.get("source", "") != "sharepoint":
              errors.append("source må være 'sharepoint'")

          expected_drive_id = os.environ.get("EXPECTED_DRIVE_ID", "")
          expected_drive_item_id = os.environ.get("EXPECTED_DRIVE_ITEM_ID", "")
          if expected_drive_id and parsed.get("drive_id", "") != expected_drive_id:
              errors.append("drive_id matcher ikke forventet repository-variabel")
          if expected_drive_item_id and parsed.get("drive_item_id", "") != expected_drive_item_id:
              errors.append("drive_item_id matcher ikke forventet repository-variabel")

          content_json_raw = parsed.get("content_json", "")
          content_json = None
          try:
              content_json = json.loads(content_json_raw)
          except json.JSONDecodeError as exc:
              errors.append(f"content_json er ikke gyldig JSON: {exc}")

          if errors:
              for error in errors:
                  print(f"✗ {error}", file=sys.stderr)
              raise SystemExit(1)

          temp_json_path = Path(os.environ["RUNNER_TEMP"]) / "content_json_payload.json"
          temp_json_path.write_text(
              json.dumps(content_json, ensure_ascii=False),
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"content_json_file={temp_json_path}", file=output)
              for key in ("drive_id", "drive_item_id", "version"):
                  print(f"{key}={parsed.get(key, '')}", file=output)
          PY

      - name: "Valider JSON-kontrakt og skriv kanonisk fil"
        id: validate
        env:
          CONTENT_JSON_FILE: ${{ steps.parse.outputs.content_json_file }}
          CANONICAL_PATH: ${{ env.CANONICAL_PATH }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          from tournament_scheduler.pipeline.activity_export import (
              ActivityJSONValidationError,
              validate_content_json,
          )

          payload = json.loads(Path(os.environ["CONTENT_JSON_FILE"]).read_text(encoding="utf-8"))
          try:
              validate_content_json(payload)
          except ActivityJSONValidationError as exc:
              print(f"JSON-kontrakt feilet: {exc}", file=sys.stderr)
              raise SystemExit(1)

          canonical_path = Path(os.environ["CANONICAL_PATH"])
          normalized = json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          normalized_bytes = normalized.encode("utf-8")
          file_sha256 = hashlib.sha256(normalized_bytes).hexdigest()
          changed = not canonical_path.exists() or canonical_path.read_bytes() != normalized_bytes

          if changed:
              canonical_path.parent.mkdir(parents=True, exist_ok=True)
              canonical_path.write_bytes(normalized_bytes)
              print("FILE_CHANGED=1")
          else:
              print("FILE_UNCHANGED=1")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"changed={'true' if changed else 'false'}", file=output)
              print(f"sha256={file_sha256}", file=output)
          PY

      - name: "Commit og push endret aktivitetsdata"
        if: steps.validate.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CANONICAL_PATH"
          git commit \
            -m "[bot] Importer aktivitetsdata fra SharePoint" \
            -m "source=sharepoint drive_id=${{ steps.parse.outputs.drive_id || 'ukjent' }} drive_item_id=${{ steps.parse.outputs.drive_item_id || 'ukjent' }} version=${{ steps.parse.outputs.version || 'ukjent' }}"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-activity-calendar:
    name: "Generer og publiser aktivitetskalender"
    needs: import-activities-json
    if: needs.import-activities-json.outputs.changed == 'true'
    uses: ./.github/workflows/activity-publish.yml
    with:
      activity_input: inputs/activities/activities.json
      activity_input_format: json
      checkout_ref: ${{ needs.import-activities-json.outputs.commit_sha }}
    secrets: inherit

  finalize-sync-issue:
    name: "Rapporter resultat og avslutt sync-issue"
    needs:
      - import-activities-json
      - publish-activity-calendar
    if: |
      always()
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.issue.title == 'sharepoint-sync: activities'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      IMPORT_RESULT: ${{ needs.import-activities-json.result }}
      PUBLISH_RESULT: ${{ needs.publish-activity-calendar.result }}
      FILE_CHANGED: ${{ needs.import-activities-json.outputs.changed }}
      FILE_SHA256: ${{ needs.import-activities-json.outputs.sha256 }}
      COMMIT_SHA: ${{ needs.import-activities-json.outputs.commit_sha }}
      DRIVE_ITEM_ID: ${{ needs.import-activities-json.outputs.drive_item_id }}
      VERSION: ${{ needs.import-activities-json.outputs.version }}
    steps:
      - name: "Kommenter og lukk ved suksess"
        if: |
          env.IMPORT_RESULT == 'success'
          && (
            env.FILE_CHANGED != 'true'
            || env.PUBLISH_RESULT == 'success'
          )
        run: |
          if [ "$FILE_CHANGED" = "true" ]; then
            cat > "$RUNNER_TEMP/issue-comment.md" <<EOF
          ✅ Aktivitetsdata er validert, importert, generert og publisert.

          - Version: \`${VERSION:-ukjent}\`
          - DriveItemId: \`${DRIVE_ITEM_ID:-ukjent}\`
          - SHA-256: \`${FILE_SHA256:-ukjent}\`
          - Commit: \`${COMMIT_SHA:-ukjent}\`
          - Actions-run: $ACTIONS_URL
          EOF
          else
            cat > "$RUNNER_TEMP/issue-comment.md" <<EOF
          ℹ️ Aktivitetsdata er validert, men er uendret. Ingen commit eller ny publisering var nødvendig.

          - Version: \`${VERSION:-ukjent}\`
          - SHA-256: \`${FILE_SHA256:-ukjent}\`
          - Actions-run: $ACTIONS_URL
          EOF
          fi

          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-comment.md"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: "Kommenter ved feil"
        if: |
          env.IMPORT_RESULT != 'success'
          || (
            env.FILE_CHANGED == 'true'
            && env.PUBLISH_RESULT != 'success'
          )
        run: |
          if [ "$IMPORT_RESULT" != "success" ]; then
            STAGE="import/validering/commit"
          else
            STAGE="generering/publisering"
          fi

          cat > "$RUNNER_TEMP/issue-comment.md" <<EOF
          ❌ SharePoint-synkronisering feilet under **$STAGE**.

          - Import-resultat: \`$IMPORT_RESULT\`
          - Publiseringsresultat: \`$PUBLISH_RESULT\`
          - Actions-run: $ACTIONS_URL

          Issuen holdes åpen for manuell gjennomgang.
          EOF

          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-comment.md"
