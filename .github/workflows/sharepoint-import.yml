name: "SharePoint: importer aktivitetsdata (JSON)"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Nummeret på GitHub-issuen som skal importeres"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: sharepoint-import-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CANONICAL_PATH: "inputs/activities/activities.json"

jobs:
  import-activities-json:
    name: "Importer aktivitetsdata (content_json) fra SharePoint"
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event.issue.title == 'sharepoint-sync: activities'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
      version: ${{ steps.parse.outputs.version }}
      drive_item_id: ${{ steps.parse.outputs.drive_item_id }}
    steps:
      - name: "Hent kode"
        uses: actions/checkout@v4

      - name: "Hent issue-body"
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          ISSUE_NUMBER="$ISSUE_NUMBER"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Henter issue #$ISSUE_NUMBER via GitHub CLI ..."
            gh issue view "$ISSUE_NUMBER" --json title,body,author_association --jq '.' > /tmp/issue-payload.json
            TITLE=$(jq -r '.title' /tmp/issue-payload.json)
            BODY=$(jq -r '.body' /tmp/issue-payload.json)
            AUTHOR_ASSOC=$(jq -r '.author_association' /tmp/issue-payload.json)

            if [ "$TITLE" != "sharepoint-sync: activities" ]; then
              echo "FEIL: Issuen har feil tittel: '$TITLE' (forventet 'sharepoint-sync: activities')" >&2
              exit 1
            fi
            if ! echo '["OWNER","MEMBER","COLLABORATOR"]' | jq -e --arg a "$AUTHOR_ASSOC" 'index($a)' > /dev/null; then
              echo "FEIL: Forfatteren har ikke trusted-tilgang: $AUTHOR_ASSOC" >&2
              exit 1
            fi

            echo "issue_body<<BODYEOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "BODYEOF" >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "issue_body<<BODYEOF" >> "$GITHUB_OUTPUT"
            cat <<'ISSUE_BODY_EOF' >> "$GITHUB_OUTPUT"
${{ github.event.issue.body }}
ISSUE_BODY_EOF
            echo "BODYEOF" >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: "Sett opp Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "Installer avhengigheter"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: "Parse issue-body"
        id: parse
        env:
          ISSUE_BODY: ${{ steps.issue.outputs.issue_body }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          issue_body = os.environ["ISSUE_BODY"]
          issue_number = os.environ["ISSUE_NUMBER"]

          REQUIRED = {"source", "content_json"}
          ALLOWED = REQUIRED | {"target_path", "drive_id", "drive_item_id", "version"}
          KEY_RE = re.compile(r"^([a-z_][a-z0-9_]*)=(.*)$")

          EXPECTED_SOURCE = "sharepoint"

          # Optional identifier validation (set as env vars in repository settings).
          EXPECTED_DRIVE_ID = os.environ.get("EXPECTED_DRIVE_ID", "")
          EXPECTED_DRIVE_ITEM_ID = os.environ.get("EXPECTED_DRIVE_ITEM_ID", "")

          errors = []
          parsed: dict[str, str] = {}
          seen: set[str] = set()

          for raw_line in issue_body.splitlines():
              line = raw_line.strip()
              if not line or line.startswith(("#", ">", "```")):
                  continue
              match = KEY_RE.match(line)
              if not match:
                  continue
              key, value = match.group(1), match.group(2).strip()
              if key in seen:
                  errors.append(f"Duplikat nøkkel: {key}")
                  continue
              if key not in ALLOWED:
                  errors.append(f"Ukjent nøkkel: {key}")
                  continue
              seen.add(key)
              if not value:
                  errors.append(f"Tom verdi for: {key}")
                  continue
              parsed[key] = value

          missing = REQUIRED - set(parsed)
          if missing:
              errors.append(f"Mangler påkrevde felt: {', '.join(sorted(missing))}")

          if parsed.get("source", "") != EXPECTED_SOURCE:
              errors.append(f"source må være '{EXPECTED_SOURCE}', fikk '{parsed.get('source', '')}'")

          if EXPECTED_DRIVE_ID and parsed.get("drive_id", "") != EXPECTED_DRIVE_ID:
              errors.append("drive_id matcher ikke forventet verdi")
          if EXPECTED_DRIVE_ITEM_ID and parsed.get("drive_item_id", "") != EXPECTED_DRIVE_ITEM_ID:
              errors.append("drive_item_id matcher ikke forventet verdi")

          # Parse content_json with a real JSON parser.
          content_json_raw = parsed.get("content_json", "")
          try:
              content_json = json.loads(content_json_raw)
          except json.JSONDecodeError as exc:
              errors.append(f"content_json er ikke gyldig JSON: {exc}")

          if errors:
              print("ISSUE_BODY_INVALID=1", file=sys.stderr)
              for error in errors:
                  print(f"  ✗ {error}", file=sys.stderr)
              sys.exit(1)

          print("ISSUE_PARSED_OK=1")
          for key in sorted(parsed):
              if key == "content_json":
                  print(f"  ✓ {key}=<validert JSON, {len(content_json_raw)} tegn>")
              else:
                  print(f"  ✓ {key}={parsed[key]}")

          # Write content_json to a temp file for the validate step.
          temp_json_path = Path(os.environ["RUNNER_TEMP"]) / "content_json_payload.json"
          temp_json_path.write_text(json.dumps(content_json, ensure_ascii=False), encoding="utf-8")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as f:
              print(f"source={parsed['source']}", file=f)
              print(f"content_json_file={temp_json_path}", file=f)
              for opt in ("target_path", "drive_id", "drive_item_id", "version"):
                  if opt in parsed:
                      print(f"{opt}={parsed[opt]}", file=f)
          PY

      - name: "Valider JSON-kontrakt og skriv kanonisk fil"
        id: validate
        env:
          CONTENT_JSON_FILE: ${{ steps.parse.outputs.content_json_file }}
          CANONICAL_PATH: ${{ env.CANONICAL_PATH }}
          VERSION: ${{ steps.parse.outputs.version || '' }}
          DRIVE_ID: ${{ steps.parse.outputs.drive_id || '' }}
          DRIVE_ITEM_ID: ${{ steps.parse.outputs.drive_item_id || '' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          from tournament_scheduler.pipeline.activity_export import (
              ActivityJSONValidationError,
              validate_content_json,
          )

          content_json_file = Path(os.environ["CONTENT_JSON_FILE"])
          canonical_path = Path(os.environ["CANONICAL_PATH"])

          # 1. Load and validate the JSON contract.
          payload = json.loads(content_json_file.read_text(encoding="utf-8"))
          try:
              validate_content_json(payload)
          except ActivityJSONValidationError as exc:
              print(f"VALIDATION_FAILED=1", file=sys.stderr)
              print(f"JSON-kontrakt feilet: {exc}", file=sys.stderr)
              sys.exit(1)

          # 2. Serialize deterministically.
          normalized = json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          normalized_bytes = normalized.encode("utf-8")
          file_sha256 = hashlib.sha256(normalized_bytes).hexdigest()

          # 3. Compare with existing canonical file.
          changed = True
          existing_sha256 = ""
          if canonical_path.exists():
              existing_sha256 = hashlib.sha256(canonical_path.read_bytes()).hexdigest()
              changed = existing_sha256 != file_sha256

          # 4. Write the canonical file only if changed.
          if changed:
              canonical_path.parent.mkdir(parents=True, exist_ok=True)
              canonical_path.write_text(normalized, encoding="utf-8")
              print("FILE_CHANGED=1")
          else:
              print("FILE_UNCHANGED=1")

          version = os.environ.get("VERSION", "") or "ukjent"
          drive_item_id = os.environ.get("DRIVE_ITEM_ID", "") or "ukjent"

          result = {
              "sha256": file_sha256,
              "size_bytes": len(normalized_bytes),
              "worksheet": payload.get("worksheet", ""),
              "row_count": len(payload.get("values", [])),
              "changed": changed,
              "existing_sha256": existing_sha256 if canonical_path.exists() else None,
              "version": version,
              "drive_item_id": drive_item_id,
          }
          result_path = Path(os.environ["GITHUB_OUTPUT"])
          with result_path.open("a") as f:
              print(f"changed={'true' if changed else 'false'}", file=f)
              print(f"sha256={file_sha256}", file=f)
              print(f"size_bytes={len(normalized_bytes)}", file=f)

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: "Commit og push endret aktivitetsdata"
        if: steps.validate.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CANONICAL_PATH"
          git commit -m "[bot] Importer aktivitetsdata (content_json) fra SharePoint" -m "source=sharepoint drive_id=${{ steps.parse.outputs.drive_id || 'ukjent' }} drive_item_id=${{ steps.parse.outputs.drive_item_id || 'ukjent' }} version=${{ steps.parse.outputs.version || 'ukjent' }}"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Kall aktivitetskalender-publisering"
        if: steps.validate.outputs.changed == 'true' && success()
        uses: ./.github/workflows/activity-publish.yml
        with:
          activity_input: ${{ env.CANONICAL_PATH }}
          activity_input_format: json

      - name: "Kommenter og lukk issue — suksess"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          FILE_CHANGED: ${{ steps.validate.outputs.changed }}
          FILE_SHA256: ${{ steps.validate.outputs.sha256 }}
        run: |
          if [ "$FILE_CHANGED" = "true" ]; then
            cat > /tmp/issue-comment.md <<'BODYEOF'
          ✅ Aktivitetsdata (content_json) er validert, importert og commitet.

          **SHA-256:** BODYEOF
            printf '`%s`\n' "$FILE_SHA256" >> /tmp/issue-comment.md
            cat >> /tmp/issue-comment.md <<'BODYEOF'
          **Commit:** BODYEOF
            printf '`%s`\n' "${{ steps.commit.outputs.commit_sha || 'ukjent' }}" >> /tmp/issue-comment.md
            cat >> /tmp/issue-comment.md <<'BODYEOF'
          **DriveItemId:** BODYEOF
            printf '`%s`\n' "${{ steps.parse.outputs.drive_item_id || 'ukjent' }}" >> /tmp/issue-comment.md
            cat >> /tmp/issue-comment.md <<'BODYEOF'
          **Version:** BODYEOF
            printf '`%s`\n' "${{ steps.parse.outputs.version || 'ukjent' }}" >> /tmp/issue-comment.md
            cat >> /tmp/issue-comment.md <<'BODYEOF'

          Aktivitetskalender-publisering er startet automatisk.
          BODYEOF
          else
            cat > /tmp/issue-comment.md <<'BODYEOF'
          ℹ️ Aktivitetsdata (content_json) er uendret — samme SHA-256 som eksisterende kanonisk fil.

          **SHA-256:** BODYEOF
            printf '`%s`\n' "$FILE_SHA256" >> /tmp/issue-comment.md
            cat >> /tmp/issue-comment.md <<'BODYEOF'

          Ingen commit er nødvendig.
          BODYEOF
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-comment.md
          gh issue close "$ISSUE_NUMBER" --reason "completed"

      - name: "Kommenter issue — feil"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cat > /tmp/issue-comment.md <<'BODYEOF'
          ❌ Import av aktivitetsdata (content_json) feilet. Se workflow-run for detaljer.

          Mulige årsaker:
          - content_json er ikke gyldig JSON
          - JSON-kontrakten er brutt (schemaVersion, worksheet, values)
          - Issue-body mangler påkrevde felt eller har ugyldige nøkler

          Workflow-run: BODYEOF
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/issue-comment.md
          cat >> /tmp/issue-comment.md <<'BODYEOF'

          Issue holdes åpen for manuell gjennomgang.
          BODYEOF
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-comment.md
