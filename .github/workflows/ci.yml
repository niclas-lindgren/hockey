name: CI

on:
  pull_request:
    paths:
      - "tournament_scheduler/**"
      - "tests/**"
      - "scripts/check"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-quick-tests:
    name: Fast Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q tournament_scheduler tests

      - name: Run fast test suite without coverage
        run: scripts/check quick
