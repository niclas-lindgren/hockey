<!-- Team travel distance table -->
<section class="report-section" id="travelStats">
  <div class="section-head">
    <div>
      <p class="eyebrow">Reise</p>
      <h2><span class="travel-icon">$ICON_TRAVEL$</span> Anslått reisebelastning per lag</h2>
    </div>
    <p class="section-note">Estimert kjøreavstand og antall bortekamper per lag.</p>
  </div>
  <div class="table-wrap">
    <table class="report-table">
      <thead>
        <tr>
          <th>Lag</th>
          <th class="numeric-cell">Reise (km)</th>
          <th class="numeric-cell">Bortekamper</th>
        </tr>
      </thead>
      <tbody id="teamTravelBody">
        <tr><td colspan="3" class="empty-cell">Ingen reisedata tilgjengelig</td></tr>
      </tbody>
    </table>
  </div>
</section>
