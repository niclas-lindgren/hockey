<!-- Team game count table -->
<section class="report-section" id="teamStats">
  <div class="section-head">
    <div>
      <p class="eyebrow">Lag</p>
      <h2>Kamper per lag</h2>
    </div>
    <p class="section-note">Antall planlagte kamper og siste spilledato per lag.</p>
  </div>
  <div class="table-wrap">
    <table class="report-table">
      <thead>
        <tr>
          <th>Lag</th>
          <th class="numeric-cell">Kamper</th>
          <th>Siste dato</th>
        </tr>
      </thead>
      <tbody id="teamGameCountsBody">
        <tr><td colspan="3" class="empty-cell">Ingen lagdata tilgjengelig</td></tr>
      </tbody>
    </table>
  </div>
</section>
